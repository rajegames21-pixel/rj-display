name: Atualizar notícias

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch_news.py
      - .github/workflows/news.yml

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Matérias já baixadas antes são reaproveitadas
      - name: Baixar dados anteriores
        run: git clone -q --depth 1 --branch news-data "https://github.com/${{ github.repository }}.git" "$RUNNER_TEMP/prev" || true

      - name: Buscar notícias
        run: python scripts/fetch_news.py "$RUNNER_TEMP/site/news" "$RUNNER_TEMP/prev/news"

      # Publica só os JSON na branch news-data (um único commit, sem histórico)
      - name: Publicar na branch news-data
        working-directory: ${{ runner.temp }}/site
        run: |
          git init -q -b news-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news
          git commit -q -m "Notícias atualizadas em $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" news-data
